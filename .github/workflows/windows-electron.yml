name: Windows Electron build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  electron-compile:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Compile Electron
        run: npm run electron:compile

      - name: Upload compiled Electron
        uses: actions/upload-artifact@v4
        with:
          name: lampa-electron-compiled
          path: electron/dist/
          if-no-files-found: error
          retention-days: 7
